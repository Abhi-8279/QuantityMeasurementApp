spring.application.name=api-gateway
server.port=${PORT:8080}

services.auth.base-url=${SERVICES_AUTH_BASE_URL:http://auth-service/internal/auth}
services.measurement.base-url=${SERVICES_MEASUREMENT_BASE_URL:http://measurement-service/internal/measurements}
services.history.base-url=${SERVICES_HISTORY_BASE_URL:http://history-service/internal/history}

app.jwt.secret=${APP_JWT_SECRET:ChangeThisJwtSecretBeforeProductionDeployment123456}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.onrender.com}

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka
